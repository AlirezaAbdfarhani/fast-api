<!-- custom_swagger.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FastAPI Offline Docs</title>
    <link rel="stylesheet" type="text/css" href="/static/swagger/swagger-ui.css" >
    <style>
        body { margin: 0; padding: 0; }
       #swagger-ui {
            padding-bottom: 20px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #4a4a4a; 
            color: #ffffff;        
            text-align: center;      
            padding: 12px 0;
            z-index: 9999;          
            font-family:  sans-serif;
            font-size: 12px;
            border-top: 1px solid #333;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
        }        
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <!-- لینک به فایل‌های JS لوکال -->
    <script src="/static/swagger/swagger-ui-bundle.js"></script>
    <script src="/static/swagger/swagger-ui-standalone-preset.js"></script>
    
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: "/openapi.json", 
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout"
            })
            window.ui = ui
        }
    </script>
    <footer >Created by Alireza abdfarhani</footer>
</body>
</html>
